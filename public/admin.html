<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot Admin</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><main class="wrap"><h1>Chatbot Admin</h1><p class="sub">Cấu hình DeepSeek, nguồn dữ liệu và lấy mã nhúng website.</p><section id="login" class="card"><label for="token">Mã quản trị (ADMIN_TOKEN)</label><input id="token" type="password" autocomplete="current-password"><div class="actions"><button id="loginBtn">Đăng nhập</button></div><p id="loginMsg"></p></section><section id="panel"><form id="settings" class="card"><h2>Cấu hình bot</h2><label>DeepSeek API key</label><input id="apiKey" type="password" autocomplete="new-password" placeholder="Để trống nếu không muốn thay đổi"><p class="muted" id="keyHint"></p><div class="row"><div><label>Model</label><input id="model"></div><div><label>Màu bot</label><input id="color" type="color"></div></div><label>Website để lấy dữ liệu</label><input id="website" type="url"><label>Allowed origins</label><input id="origins" placeholder="https://example.com,https://www.example.com"><label>Tên chatbot</label><input id="title"><div class="actions"><button type="submit">Lưu cấu hình</button><button type="button" id="reindex">Lập chỉ mục lại</button></div><p id="msg"></p></form><section class="card"><h2>HTML gắn vào website</h2><p class="muted">Đặt trước thẻ đóng &lt;/head&gt;. Thay URL backend nếu triển khai trên domain khác.</p><textarea id="snippet" readonly></textarea><div class="actions"><button id="copy">Copy HTML</button></div></section></section></main></body></html>
