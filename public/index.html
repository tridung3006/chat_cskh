<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Website Chatbot — Demo</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f3;color:#171717}header{padding:20px 6%;background:white;border-bottom:1px solid #ddd;font-weight:750}main{max-width:780px;margin:70px auto;padding:0 24px}h1{font-size:clamp(36px,7vw,72px);line-height:1;margin:0 0 24px;letter-spacing:-.04em}p{font-size:19px;line-height:1.65;color:#555}.tag{display:inline-block;padding:7px 10px;border:1px solid #bbb;border-radius:99px;margin-bottom:24px;font-size:13px}
  </style>
  <script src="/widget.js" data-api-url="http://localhost:3000" data-title="Trợ lý tư vấn" data-color="#111827" defer></script>

<body><header>Website Demo</header><main><span class="tag">DeepSeek RAG chatbot</span><h1>Chatbot đã sẵn sàng.</h1><p>Nhấn biểu tượng trò chuyện ở góc phải bên dưới để mở widget. Bản chạy hiện tại dùng API key mẫu; hãy cấu hình key DeepSeek thật trong file <code>.env</code> để nhận câu trả lời.</p></main></body>
</html>
