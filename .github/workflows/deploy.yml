name: Deploy chat-cskh

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-cskh-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: [self-hosted, Linux, ARM64, chat-cskh]
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate application
        run: |
          npm ci
          find src public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Deploy container
        env:
          APP_DIR: /home/sonnguyen/apps/chat-cskh
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='compose.yml' \
            --exclude='data/' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

          cd "$APP_DIR"
          docker compose build
          docker compose up -d --force-recreate

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3035/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs --tail=100
          exit 1

      - name: Verify public endpoint
        run: curl -fsS --retry 5 --retry-delay 3 https://chat-cskh.shunify.com/api/health
